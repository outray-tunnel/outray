# Keep production deployment on GitHub Actions until the Woodpecker build,
# edge access, and production secrets have all been verified.
when:
  - event: push
    branch: main
  - event: push
    branch: next
  - event: manual
    branch: main

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outray_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

steps:
  - name: install
    image: node:20-bookworm
    environment:
      HUGEICONS_LICENSE_KEY:
        from_secret: hugeicons_license_key
    commands:
      - npm ci --no-audit

  - name: build
    image: node:20-bookworm
    commands:
      - npm run build -- --concurrency=1 --filter=outray-web --filter=outray-tunnel --filter=outray-internal-check --filter=outray-cron --filter=outray-status --filter=outray-uptime-probe

  - name: test-services
    image: node:20-bookworm
    commands:
      - npm run test --workspace=outray-tunnel
      - npm run test --workspace=outray-status
      - npm run test --workspace=outray-uptime-probe

  - name: test-web-database
    image: node:20-bookworm
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/outray_test
      OUTRAY_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/outray_test
      OUTRAY_RUN_DB_INTEGRATION: "1"
      OUTRAY_SECRETS_ACTIVE_MASTER_KEY_ID: ci-v1
      OUTRAY_SECRETS_ACTIVE_MASTER_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      OUTRAY_SECRETS_PREVIOUS_MASTER_KEYS: "{}"
    commands:
      - npm exec --workspace=outray-web -- drizzle-kit migrate --config=drizzle.config.ts
      - npm run test --workspace=outray-web

  # Keep the GitHub Actions deployment active until this manual path has been
  # exercised successfully. Never expose production secrets to pull requests.
  - name: deploy-tinybird
    image: python:3.11-slim
    when:
      - event: manual
        branch: main
    environment:
      TINYBIRD_HOST:
        from_secret: tinybird_host
      TINYBIRD_TOKEN:
        from_secret: tinybird_token
    commands:
      - pip install --disable-pip-version-check tinybird==4.6.15
      - tb --cloud --host "$TINYBIRD_HOST" --token "$TINYBIRD_TOKEN" deploy --check
      - tb --cloud --host "$TINYBIRD_HOST" --token "$TINYBIRD_TOKEN" deploy

  - name: migrate-production-database
    image: node:20-bookworm
    when:
      - event: manual
        branch: main
    environment:
      DATABASE_URL:
        from_secret: database_url
    commands:
      - test -n "$DATABASE_URL"
      - npm exec --workspace=outray-web -- drizzle-kit check --config=drizzle.config.ts
      - npm exec --workspace=outray-web -- drizzle-kit migrate --config=drizzle.config.ts
      - npm run tokens:backfill --workspace=outray-web

  - name: deploy-edge
    image: node:20-bookworm
    when:
      - event: manual
        branch: main
    environment:
      EDGE_SSH_KEY:
        from_secret: edge_ssh_key
    commands:
      - apt-get update -qq && apt-get install -y -qq openssh-client
      - bash deploy/woodpecker/deploy-edge.sh
