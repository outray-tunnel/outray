<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OutRay Ops · Favicon preview</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-self-hosted.svg?v=metal-1" />
    <style>
      @font-face { font-family: Geom; src: url('/fonts/geom-latin.woff2') format('woff2'); font-display: swap; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #09090b; color: #f4f4f5; font-family: Geom, system-ui, sans-serif; padding: 32px 20px; }
      main { width: min(100%, 640px); }
      h1 { font-size: 24px; font-weight: 500; margin: 0 0 8px; }
      p { color: #a1a1aa; font-size: 14px; line-height: 1.6; margin: 0; }
      .samples { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 28px 0 20px; }
      .sample { padding: 32px 24px 20px; border: 1px solid #27272a; border-radius: 16px; background: #111113; }
      .sample.light { background: #fafafa; border-color: #e4e4e7; }
      .mark { display: block; width: 96px; height: 96px; margin: 8px auto 32px; }
      .sizes { display: flex; align-items: center; justify-content: center; gap: 24px; height: 40px; }
      .label { font-size: 12px; color: #a1a1aa; text-align: center; margin-top: 20px; }
      .light .label { color: #71717a; }
      .note { font-size: 12px; }
      code { color: #d4af37; }
      @media (max-width: 420px) { .samples { gap: 10px; } .sample { padding: 24px 12px 16px; } .sizes { gap: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Polished gold, with no background.</h1>
      <p>Reflective highlights, warm shadows, and softly beveled edges. This tab uses the metallic preview favicon.</p>
      <div class="samples">
        <section class="sample" aria-label="Preview on a dark background">
          <img class="mark" src="/favicon-self-hosted.svg?v=metal-1" alt="Metallic gold OutRay mark" width="96" height="96" />
          <div class="sizes" aria-hidden="true">
            <img src="/favicon-self-hosted.svg?v=metal-1" alt="" width="16" height="16" />
            <img src="/favicon-self-hosted.svg?v=metal-1" alt="" width="24" height="24" />
            <img src="/favicon-self-hosted.svg?v=metal-1" alt="" width="32" height="32" />
          </div>
          <p class="label">Dark · 16 / 24 / 32 px</p>
        </section>
        <section class="sample light" aria-label="Preview on a light background">
          <img class="mark" src="/favicon-self-hosted.svg?v=metal-1" alt="Metallic gold OutRay mark" width="96" height="96" />
          <div class="sizes" aria-hidden="true">
            <img src="/favicon-self-hosted.svg?v=metal-1" alt="" width="16" height="16" />
            <img src="/favicon-self-hosted.svg?v=metal-1" alt="" width="24" height="24" />
            <img src="/favicon-self-hosted.svg?v=metal-1" alt="" width="32" height="32" />
          </div>
          <p class="label">Light · 16 / 24 / 32 px</p>
        </section>
      </div>
      <p class="note">Approved for self-hosted consoles. Hosted OutRay keeps its existing favicon.</p>
    </main>
  </body>
</html>
